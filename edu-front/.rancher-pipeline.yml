stages:
- name: Build image and push
  steps:
  - publishImageConfig:
      dockerfilePath: ./Dockerfile
      buildContext: .
      tag: 172.18.0.197/library/edu-test:${CICD_EXECUTION_SEQUENCE}
      pushRemote: true
      registry: 172.18.0.197
    env:
      PLUGIN_DEBUG: "true"
      PLUGIN_INSECURE: "true"
- name: Deploy
  steps:
  - applyYamlConfig:
      path: ./deployment.yaml
timeout: 60
notification: {}
