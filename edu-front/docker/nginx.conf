map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

client_max_body_size 6000m;
client_body_buffer_size 50m;
underscores_in_headers on;

# server {
#     listen 80;
#     server_name *.chip-cloud.com 172.18.0.* 124.135.23.220;
#     rewrite ^(.*)$  https://$host$1 permanent;
# }

server {
  # listen 443 ssl;

  # ssl_certificate     /etc/nginx/ssl/tls.crt;
  # ssl_certificate_key /etc/nginx/ssl/tls.key;

  # server_name *.chip-cloud.com 172.18.0.* 124.135.23.220;

    listen 80;
    server_name *.chip-cloud.com 172.18.0.* 124.135.23.220;
    # rewrite ^(.*)$  https://$host$1 permanent;

     # compression-webpack-plugin 配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    # 配置禁用 gzip 条件，支持正则，此处表示 ie6 及以下不启用 gzip（因为ie低版本不支持）
    gzip_disable "MSIE [1-6]\.";

  location /edu {
    rewrite ^/edu/(.*)$ /$1 break;
    proxy_buffer_size          32k;
    proxy_buffers              4 64k;
    proxy_busy_buffers_size    128k;
    proxy_temp_file_write_size 128k;
    # proxy_pass https://172.18.0.185:32009; # test
    proxy_pass http://zkxy-gateway-test.zkxy-edu-test.svc.cluster.local:7979;
    proxy_redirect default ;
  }

  location / {
    root /usr/share/nginx/html/; # 外网
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
    error_page 405 =200 $uri;
  }

  location /files {
    rewrite ^/files/(.*)$ /$1 break;
    proxy_pass http://172.18.7.21:19001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

  location /wss {
    rewrite ^/wss/(.*?)/(.+)$ /ticket/$2 break;
    proxy_pass http://$1;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

  location /websockify {
    set $flag "vm" ;

    if ($request_uri ~* ":3|:6|%3A3|%3A6") {
        set $flag "docker" ;
    }

    if ($flag = "vm") {
        rewrite ^/websockify/(.*?)/token/(\d+) /websockify/?token=$2 break;
        proxy_pass http://$1:6080;
    }

    if ($flag = "docker") {
        rewrite ^/websockify/(.*?)/token/(\d+) /websockify/?token=$2 break;
        proxy_pass http://$1;
    }

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Raw-Url $1:$2;
  }

  location /novnc {
    rewrite ^/novnc/(.*)$ /$1 break;
    proxy_pass http://novnc.devops.svc.cluster.local:5900;
    # proxy_pass http://172.180.0.101:30607;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

  }


  location /getToken {
    rewrite ^/getToken/(.*)$ /$1 break;
    proxy_pass http://zkxy-vm-web-test.zkxy-edu-test.svc.cluster.local:8888;
    proxy_redirect default ;
  }

 location /ws/ {
    proxy_pass  http://zkxy-vm-web-test.zkxy-edu-test.svc.cluster.local:8888;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1200s;
  }
  location /wsmsg/ {
    rewrite ^/wsmsg/(.*)$ /$1 break;
    proxy_pass http://zkxy-message-center-test.zkxy-edu-test.svc.cluster.local:9080;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1200s;
  }

  # location /wslog/ {
  #   rewrite ^/wslog/(.*)$ /$1 break;
  #   proxy_pass http://zkxy-resource-adapter-webapp.zkxy.svc.cluster.local:30227; # test
  #   proxy_http_version 1.1;
  #   proxy_redirect off;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  #   proxy_read_timeout 1200s;
  # }





}
