apiVersion: v1
kind: Service
metadata:
  name: crm-test
  namespace: zkxy-crm-test
spec:
  selector:
    app: crm-test
  #type: LoadBalancer
  type: NodePort
  #externalTrafficPolicy: Local  # 保留客户端的真实 IP 地址
  #loadBalancerIP: 172.18.0.94
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30980
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-test
  namespace: zkxy-crm-test
  labels:
    app: crm-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-test
  template:
    metadata:
      labels:
        app: crm-test
    spec:
      imagePullSecrets:
        - name: private-repository
      containers:
        - name: crm-test #pod的名称，必须字段，名称唯一且对象创建后不可以被修改
          image: ${CICD_IMAGE}:${CICD_EXECUTION_SEQUENCE} #镜像仓库的路径/镜像的名称:镜像的标签
          imagePullPolicy: Always #Always(总是去仓库下载),Never(从不去仓库下载),IfNotPresent(如果本地没有就去仓库下载),默认是"IfNotPresent"
          ports:
            - containerPort: 80 #containerPort是pod内部容器的端口，targetPort映射到containerPort;例如，mysql服务需要暴露3306端口，redis暴露6379端口
          volumeMounts:
            - mountPath: /etc/localtime
              name: tz-config
            # - name: crm-test-certs
            #   mountPath: /etc/nginx/ssl
            #   readOnly: true
          env:
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: tz-config
          hostPath:
            path: /etc/localtime
            type: ""
        # - name: crm-test-certs
        #   secret:
        #     secretName: crm-test-certs
